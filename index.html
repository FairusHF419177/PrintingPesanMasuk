<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Input Barang Printing</title>
<style>
:root{--ac:#2563eb;--bd:#cbd5e1;--tx:#0f172a;--mu:#475569}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f9;color:var(--tx)}
.w{max-width:560px;margin:0 auto;padding:14px}h1{font-size:19px;margin:6px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:2px solid var(--bd);background:#fff;border-radius:10px;font-weight:700;font-size:15px;color:var(--mu)}
.tabs button.on{border-color:var(--ac);background:var(--ac);color:#fff}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:0 0 4px;text-transform:uppercase}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:16px;min-height:44px;color:var(--tx);background:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;margin-bottom:8px}
.x{border:0;background:#fee2e2;color:#b91c1c;font-size:22px;border-radius:8px;height:44px}
.add{width:100%;padding:12px;border:2px dashed var(--ac);background:#eff6ff;color:var(--ac);font-weight:700;border-radius:10px;font-size:15px}
.send{width:100%;padding:15px;border:0;border-radius:12px;background:#16a34a;color:#fff;font-weight:800;font-size:16px}
.send:disabled{opacity:.5}
#msg{margin:0 0 10px;padding:10px;border-radius:8px;font-size:14px;display:none}
.ok{background:#dcfce7;color:#14532d}.er{background:#fee2e2;color:#7f1d1d}
</style></head><body><div class="w">
<h1>📦 Input Barang Printing</h1>
<div id="cfg" class="card" style="display:none"><label>URL Web App Apps Script</label>
<input id="url" placeholder=https://script.google.com/macros/s/AKfycbwBy_yU86b8_lRMErCwsaRmErRkl1bsOWDegmXrJIbXgUFMz0Il1chJZid6-OYxLQTJDw/exec></div>
<div class="tabs"><button id="tM" class="on">Barang Masuk</button><button id="tP">Pemesanan</button></div>
<div class="card"><div class="g"><div><label>Tanggal</label><input type="date" id="tgl"></div>
<div id="jamBox"><label>Jam</label><input type="time" id="jam"></div></div>
<div style="margin-top:10px"><label id="lN">Penerima</label><input id="nama" placeholder="Nama"></div></div>
<div class="card"><label>Daftar item (1 item = 1 baris di sheet)</label><div id="items"></div>
<button class="add" id="add" type="button">+ Tambah Item</button></div>
<div id="msg"></div><button class="send" id="send">Kirim</button>
<datalist id="dl"></datalist></div>
<script>
var SCRIPT_URL="PASTE_URL_WEB_APP_DI_SINI",type="MASUK",rid=newId();
var $=function(i){return document.getElementById(i)};
function newId(){return Date.now()+"-"+Math.random().toString(36).slice(2)}
function wib(){var d=new Date(Date.now()+7*36e5),p=function(n){return String(n).padStart(2,"0")};
 return{d:d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate()),t:p(d.getUTCHours())+":"+p(d.getUTCMinutes())}}
function addRow(){var r=document.createElement("div");r.className="row";
 r.innerHTML='<input class="it" list="dl" placeholder="Nama item"><input class="q" type="number" inputmode="decimal" min="0" step="any" placeholder="Qty"><button type="button" class="x">×</button>';
 r.querySelector(".x").onclick=function(){if($("items").children.length>1)r.remove();else{r.querySelector(".it").value="";r.querySelector(".q").value=""}};
 $("items").appendChild(r);return r}
function setType(t){type=t;$("tM").className=t=="MASUK"?"on":"";$("tP").className=t=="PESAN"?"on":"";
 $("jamBox").style.display=t=="MASUK"?"":"none";$("lN").textContent=t=="MASUK"?"Penerima":"Pemesan"}
function show(m,c){var e=$("msg");e.textContent=m;e.className=c;e.style.display="block"}
function loadItems(u){if(!u||u.indexOf("PASTE")==0)return;
 fetch(u+"?action=items").then(function(r){return r.json()}).then(function(j){
  $("dl").innerHTML=(j.items||[]).map(function(i){return'<option value="'+i.replace(/"/g,"&quot;")+'">'}).join("")}).catch(function(){})}
$("tM").onclick=function(){setType("MASUK")};$("tP").onclick=function(){setType("PESAN")};
$("add").onclick=function(){addRow().querySelector(".it").focus()};
$("url").onchange=function(){loadItems(this.value.trim())};
$("send").onclick=async function(){
 var url=SCRIPT_URL.indexOf("PASTE")==0?$("url").value.trim():SCRIPT_URL;
 if(!url)return show("Isi dulu URL Web App Apps Script.","er");
 if(!$("nama").value.trim())return show("Nama wajib diisi.","er");
 var items=[].map.call($("items").children,function(r){return{item:r.querySelector(".it").value.trim(),qty:parseFloat(r.querySelector(".q").value)}})
  .filter(function(x){return x.item||x.qty});
 if(!items.length||items.some(function(x){return!x.item||!(x.qty>0)}))return show("Setiap item harus punya nama dan qty lebih dari 0.","er");
 var b=$("send");b.disabled=true;b.textContent="Mengirim...";
 try{
  await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify({type:type,tanggal:$("tgl").value,jam:$("jam").value,nama:$("nama").value,items:items,requestId:rid})});
  show("Terkirim: "+items.length+" item masuk ke sheet "+type+" ("+items.length+" baris).","ok");
  $("items").innerHTML="";addRow();rid=newId();loadItems(url);
 }catch(e){show("Gagal mengirim (cek koneksi). Data belum terkirim, silakan coba lagi.","er")}
 b.disabled=false;b.textContent="Kirim"};
var n=wib();$("tgl").value=n.d;$("jam").value=n.t;addRow();
if(SCRIPT_URL.indexOf("PASTE")==0)$("cfg").style.display="block";else loadItems(SCRIPT_URL);
</script></body></html>
